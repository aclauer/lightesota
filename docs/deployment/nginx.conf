# Example only: include inside nginx's http {} after operator review.
# Provision trusted certificates separately; this file never requests them.
map $http_upgrade $lightesota_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name lights.example.invalid;
    ssl_certificate /etc/ssl/lightesota/fullchain.pem;
    ssl_certificate_key /etc/ssl/lightesota/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Share links may contain tokens; do not log full requests or headers.
    access_log off;
    error_log /dev/null crit;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'microphone=(self)' always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lightesota_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
