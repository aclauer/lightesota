services:
  lightesota:
    build: .
    restart: unless-stopped
    # Host networking so Art-Net UDP reaches the ODE and the upstream listener can bind 6454.
    network_mode: host
    environment:
      - PORT=8787
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LIGHTESOTA_HERMES_BASE_URL=${LIGHTESOTA_HERMES_BASE_URL:-http://127.0.0.1:8645/v1}
      - LIGHTESOTA_HERMES_PROXY_KEY=${LIGHTESOTA_HERMES_PROXY_KEY:-}
      - LIGHTESOTA_PREVIEW=${LIGHTESOTA_PREVIEW:-0}
      - LIGHTESOTA_OUTPUT_COMMISSIONED=${LIGHTESOTA_OUTPUT_COMMISSIONED:-0}
      - LIGHTESOTA_HAZE_COMMISSIONED=${LIGHTESOTA_HAZE_COMMISSIONED:-0}
      - LIGHTESOTA_GISKARD_ENABLED=${LIGHTESOTA_GISKARD_ENABLED:-0}
      - LIGHTESOTA_GISKARD_TOKEN=${LIGHTESOTA_GISKARD_TOKEN:-}
      - LIGHTESOTA_GISKARD_TEAM_ID=${LIGHTESOTA_GISKARD_TEAM_ID:-}
      - LIGHTESOTA_GISKARD_CHANNEL_ID=${LIGHTESOTA_GISKARD_CHANNEL_ID:-}
      - LIGHTESOTA_GISKARD_USER_IDS=${LIGHTESOTA_GISKARD_USER_IDS:-}
    volumes:
      - ./data:/data
